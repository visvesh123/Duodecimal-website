# Deploys the website (frontend/) to the existing Cloud Run service on every push to main.
# One-time setup of the GitHub-to-Google Cloud sign-in: docs/DEPLOY.md
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Skipped until the GitHub-to-Google Cloud sign-in is configured.
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy duodecimal-website \
            --source frontend \
            --project muone-qtap \
            --region asia-south1 \
            --quiet
